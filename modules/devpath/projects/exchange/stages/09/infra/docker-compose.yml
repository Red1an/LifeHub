# Инфраструктура биржи. Файл кладёт хаб и обновляет при открытии этапа: новые сервисы появляются по мере надобности.
name: devpath-exchange

services:
  postgres:
    image: postgres:17-alpine
    # Несколько экземпляров API со своими пулами соединений (по 100 по умолчанию) — лимит сервера должен их вместить.
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_USER: exchange
      POSTGRES_PASSWORD: exchange
      POSTGRES_DB: exchange
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exchange"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Kafka в режиме KRaft (без ZooKeeper), один узел. Снаружи — localhost:19092.
  kafka:
    image: apache/kafka:3.9.1
    ports:
      - "19092:19092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,EXTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 3s
      timeout: 10s
      retries: 40

  # Наблюдаемость: приложение шлёт метрики и трейсы по OTLP в коллектор, тот раздаёт их дальше.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.131.1
    command: ["--config=/etc/otel/config.yml"]
    volumes:
      - ./otel-collector.yml:/etc/otel/config.yml:ro
    ports:
      - "14317:4317"   # OTLP gRPC
      - "14318:4318"   # OTLP HTTP

  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--web.enable-lifecycle"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability:/etc/prometheus/user:ro   # твои правила алертов: observability/*.yml
    ports:
      - "19090:9090"

  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./grafana:/etc/grafana/provisioning:ro
      - ../observability/dashboards:/var/lib/grafana/dashboards:ro   # твои дашборды: observability/dashboards/*.json
    ports:
      - "13000:3000"

  jaeger:
    image: jaegertracing/jaeger:2.9.0
    ports:
      - "16686:16686"   # интерфейс и API трейсов

volumes:
  pgdata:
